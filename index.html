<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f4" />
    <meta name="description" content="Doro as a shrimp, a puppy, and two blue cats. Spin them around and see every side." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Doro</title>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <p class="eyebrow">It started with a GIF</p>
          <h1><span lang="en">Doro</span></h1>
        </div>
        <div class="header-right">
          <nav class="mode-picker" aria-label="Choose a character">
            <button data-mode="shrimp" aria-pressed="true">Shrimp</button>
            <button data-mode="dog" aria-pressed="false">Puppy</button>
            <button data-mode="palico" aria-pressed="false">Blue Cat</button>
            <button data-mode="siamese" aria-pressed="false">Cat on All Fours</button>
          </nav>
          <p class="intro">Spin it around. See every side.</p>
        </div>
      </header>

      <section class="exhibit" aria-label="Doro 3D viewer">
        <div class="viewer-column">
          <div id="stage" class="stage" aria-busy="true">
            <canvas id="canvas" tabindex="0" role="img" aria-label="Interactive 3D model of Doro Shrimp" aria-describedby="gesture-help" hidden></canvas>
            <p id="cat-caption" class="cat-caption" hidden></p>
            <div id="load-status" class="load-status" role="status" aria-live="polite">
              <p id="load-title">Here comes Doro…</p>
              <p id="load-detail">Loading 3D model</p>
              <progress id="load-progress" aria-label="Model loading progress"></progress>
              <button id="retry" class="text-button" hidden>Try again <span aria-hidden="true">↗</span></button>
            </div>
            <noscript><p class="no-script">Enable JavaScript to explore Doro in 3D.</p></noscript>
          </div>

          <div class="toolbar" aria-label="Viewer controls">
            <div class="model-controls">
              <button id="play" class="control control-primary" disabled aria-label="Pause animation">
                <svg id="play-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M11 3v10" /></svg>
                <span id="play-label">Pause</span>
              </button>
              <button id="front" class="control" disabled>Front view</button>
              <button id="head" class="control" disabled aria-pressed="false">Head</button>
            </div>
            <button id="compare" class="control compare-control" aria-expanded="false" aria-controls="reference-panel">Original GIF <span class="compare-mark" aria-hidden="true">＋</span></button>
          </div>
        </div>

        <aside id="reference-panel" class="reference-panel" aria-label="Original reference" hidden>
          <div class="reference-heading"><span>The original GIF</span><span class="reference-index" aria-hidden="true">01</span></div>
          <figure>
            <img id="reference" alt="Original GIF of a pink-haired Doro swaying on a curled shrimp body" width="240" height="192" />
            <p id="reference-error" class="reference-error" hidden>The original GIF could not load.</p>
            <figcaption>The one that started it all.</figcaption>
          </figure>
        </aside>
      </section>

      <footer class="page-footer">
        <p id="gesture-help">Drag to rotate <span aria-hidden="true">·</span> Scroll or pinch to zoom</p>
        <p id="motion-note" aria-live="polite">Doro is cute. So are shrimp.</p>
      </footer>
      <p class="sr-only">Focus the model, then use arrow keys to rotate, plus and minus to zoom, and Home for the front view.</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
